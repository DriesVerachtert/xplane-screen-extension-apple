name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen swiftlint swiftformat xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: SwiftFormat (check only)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint

      - name: Build and test (macOS)
        run: |
          set -o pipefail
          xcodebuild -scheme XPlaneScreenExtension-macOS -destination 'platform=macOS' test | xcbeautify

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild -scheme XPlaneScreenExtension-iOS -destination 'generic/platform=iOS Simulator' build | xcbeautify
